name: Build OP16 visual index

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/build-op16-index.mjs'
      - '.github/workflows/build-op16-index.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install @tensorflow/tfjs-node@4.22.0 @tensorflow-models/mobilenet@2.1.1
      - name: Build index
        run: node tools/build-op16-index.mjs
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/op16-index.json
          git diff --cached --quiet || git commit -m "Build OP16 visual index"
          git push
